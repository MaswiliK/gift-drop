<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Operation: Teddy Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button id="sound" type="button" aria-pressed="true" aria-label="Sound on">🔊</button>

<main id="app">

  <!-- 1. ENTRANCE -->
  <section id="s-entrance" class="screen active">
    <div class="bg"></div>
    <p id="transmission">An anonymous transmission has arrived.<br>Someone has something for you...</p>
    <button id="prompt" type="button" class="prompt">Tap to open</button>
    <p id="sig1" class="sig">— B. 🦇</p>
  </section>

  <!-- 2 + 3. GIFT BOX + TEDDY REVEAL -->
  <section id="s-gift" class="screen">
    <div class="bg"></div>
    <p id="giftMsg">Your package is waiting.<br>Tap to unwrap.</p>
    <div class="stage">
      <img id="teddy" src="assets/images/teddy.jpg" alt="A glowing pink teddy bear">
      <button id="box" type="button" aria-label="Tap to unwrap the package">
        <img src="assets/images/giftbox.jpg" alt="A wrapped package with a burgundy ribbon">
      </button>
    </div>
    <button id="toLetter" type="button" class="cta">There's a little something from Batman...</button>
  </section>

  <!-- 4. LETTER -->
  <section id="s-letter" class="screen">
    <div class="bg"></div>
    <article id="letter">
      <div id="letterBody"></div>
      <p id="sig2">— B. 🦇</p>
      <div id="letterEnd"></div>
      <button id="replay" type="button">Replay the surprise</button>
    </article>
  </section>

</main>

<div id="fx" aria-hidden="true"></div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/animations.js"></script>
<script src="js/app.js"></script>
</body>
</html>
